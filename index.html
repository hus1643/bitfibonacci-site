<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bitfibonacci.com — Coming Soon</title>

  <!-- Modern Geometric & Monospace Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Instant Theme Initialization (Prevents Flash of Wrong Theme) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('bf-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>
    /* Reset & Base Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Default Dark Theme Tokens */
    :root,
    [data-theme="dark"] {
      --bg-deep: #090e14;
      --bg-slate: #0f1722;
      --surface: rgba(13, 20, 30, 0.74);
      --border: rgba(148, 163, 184, 0.14);
      --border-hover: rgba(74, 222, 128, 0.42);
      --text-primary: #f4f7fa;
      --text-secondary: #8b9bb0;
      --emerald: #4ade80;
      --emerald-soft: rgba(74, 222, 128, 0.11);
      --emerald-border: rgba(74, 222, 128, 0.24);
      --amber: #facc15;
      --grid-stroke: #64748b;
      --grid-opacity: 0.14;
      --spiral-stroke: #4ade80;
      --spiral-opacity: 0.28;
      --btn-bg: rgba(18, 27, 39, 0.85);
      --btn-bg-hover: rgba(25, 38, 54, 0.96);
      --primary-btn-bg: linear-gradient(135deg, rgba(22, 101, 52, 0.34), rgba(15, 23, 34, 0.92));
      --card-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
      --btn-shadow: 0 10px 26px rgba(0, 0, 0, 0.38);
      --heading-gradient: linear-gradient(135deg, #ffffff 30%, #a7f3d0 85%, #fde047 100%);
      --footer-color: rgba(139, 155, 176, 0.45);
    }

    /* Crisp White / Light Theme Tokens */
    [data-theme="light"] {
      --bg-deep: #fafafa;
      --bg-slate: #f1f5f9;
      --surface: rgba(255, 255, 255, 0.84);
      --border: rgba(15, 23, 42, 0.09);
      --border-hover: rgba(21, 128, 61, 0.38);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --emerald: #15803d;
      --emerald-soft: rgba(21, 128, 61, 0.08);
      --emerald-border: rgba(21, 128, 61, 0.22);
      --amber: #d97706;
      --grid-stroke: #64748b;
      --grid-opacity: 0.14;
      --spiral-stroke: #15803d;
      --spiral-opacity: 0.24;
      --btn-bg: rgba(248, 250, 252, 0.92);
      --btn-bg-hover: #ffffff;
      --primary-btn-bg: linear-gradient(135deg, rgba(21, 128, 61, 0.11), rgba(255, 255, 255, 0.96));
      --card-shadow: 0 24px 60px rgba(15, 23, 42, 0.07);
      --btn-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      --heading-gradient: linear-gradient(135deg, #0f172a 25%, #15803d 85%, #b45309 100%);
      --footer-color: rgba(71, 85, 105, 0.55);
    }

    html, body {
      height: 100%;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Full-Viewport Centered Stage */
    .page-stage {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at 78% 18%, rgba(250, 204, 21, 0.06) 0%, transparent 42%),
        radial-gradient(circle at 22% 82%, var(--emerald-soft) 0%, transparent 48%),
        linear-gradient(160deg, var(--bg-slate) 0%, var(--bg-deep) 100%);
      overflow: hidden;
      transition: background 0.25s ease;
    }

    /* Top-Right Theme Toggle Button */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--btn-shadow);
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease, color 0.18s ease;
      touch-action: manipulation;
    }

    .theme-toggle:hover,
    .theme-toggle:focus-visible {
      transform: translateY(-1px);
      border-color: var(--border-hover);
      color: var(--emerald);
      outline: none;
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Show sun in dark mode (to switch to light), moon in light mode (to switch to dark) */
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="light"] .icon-sun { display: none; }

    /* Pure-SVG Geometric Fibonacci Golden-Ratio Backdrop */
    .fibonacci-backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .fibonacci-backdrop svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Centered Editorial Content Card */
    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 460px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 46px 32px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--card-shadow);
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* Eyebrow Domain Pill */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--emerald);
      background: var(--emerald-soft);
      border: 1px solid var(--emerald-border);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--amber);
      box-shadow: 0 0 8px var(--amber);
    }

    /* Main Headline */
    h1 {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(2.1rem, 5.5vw, 3.1rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.08;
      color: var(--text-primary);
    }

    h1 span {
      background: var(--heading-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Action Pill Buttons */
    .links-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 2px;
      width: 100%;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 22px;
      border-radius: 999px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: var(--text-primary);
      background: var(--btn-bg);
      border: 1px solid var(--border);
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
      touch-action: manipulation;
    }

    .pill-btn:hover,
    .pill-btn:focus-visible {
      transform: translateY(-2px);
      border-color: var(--border-hover);
      background: var(--btn-bg-hover);
      box-shadow: var(--btn-shadow);
      outline: none;
    }

    .pill-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .pill-btn.primary {
      border-color: var(--emerald-border);
      background: var(--primary-btn-bg);
    }

    .pill-btn.primary:hover {
      border-color: var(--emerald);
    }

    /* Footer Micro-Note */
    .footer-note {
      position: relative;
      z-index: 1;
      margin-top: 26px;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--footer-color);
    }

    @media (max-width: 480px) {
      .theme-toggle {
        top: 14px;
        right: 14px;
        width: 38px;
        height: 38px;
      }

      .hero-content {
        padding: 36px 22px;
        border-radius: 20px;
      }

      .pill-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page-stage">
    <!-- Accessible Top-Right Theme Toggle (White / Dark) -->
    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
      aria-label="Toggle color theme"
      title="Switch between light and dark theme"
    >
      <!-- Sun Icon (shown in dark theme) -->
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="2" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22"></line>
        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
        <line x1="2" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22" y2="12"></line>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>

      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <!-- Pure Inline SVG Geometric Fibonacci Golden-Ratio Grid Backdrop -->
    <div class="fibonacci-backdrop" aria-hidden="true">
      <svg viewBox="0 0 987 610" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Fine Fibonacci Square Matrix (21px step) -->
          <pattern id="fibGrid" width="21" height="21" patternUnits="userSpaceOnUse">
            <path d="M 21 0 L 0 0 0 21" fill="none" stroke="var(--grid-stroke)" stroke-width="0.5" stroke-opacity="var(--grid-opacity)" />
          </pattern>

          <!-- Soft Radial Vignette Mask -->
          <radialGradient id="edgeFade" cx="50%" cy="50%" r="58%">
            <stop offset="40%" stop-color="#ffffff" stop-opacity="1" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
          </radialGradient>
          <mask id="gridMask">
            <rect width="987" height="610" fill="url(#edgeFade)" />
          </mask>
        </defs>

        <g mask="url(#gridMask)">
          <!-- Base Matrix -->
          <rect width="987" height="610" fill="url(#fibGrid)" />

          <!-- Golden Ratio Subdivision Lines (987 x 610 -> 610, 377, 233, 144, 89, 55, 34, 21) -->
          <g stroke="var(--grid-stroke)" stroke-width="0.75" stroke-opacity="0.22" fill="none">
            <rect x="0.5" y="0.5" width="986" height="609" />
            <line x1="610" y1="0" x2="610" y2="610" />
            <line x1="610" y1="377" x2="987" y2="377" />
            <line x1="754" y1="377" x2="754" y2="610" />
            <line x1="610" y1="466" x2="754" y2="466" />
            <line x1="699" y1="377" x2="699" y2="466" />
            <line x1="699" y1="432" x2="754" y2="432" />
            <line x1="720" y1="432" x2="720" y2="466" />
          </g>

          <!-- Clean Golden Spiral Arcs -->
          <path
            d="M 0 610
               A 610 610 0 0 1 610 0
               A 377 377 0 0 1 987 377
               A 233 233 0 0 1 754 610
               A 144 144 0 0 1 610 466
               A 89 89 0 0 1 699 377
               A 55 55 0 0 1 754 432
               A 34 34 0 0 1 720 466"
            fill="none"
            stroke="var(--spiral-stroke)"
            stroke-width="1"
            stroke-opacity="var(--spiral-opacity)"
          />
        </g>
      </svg>
    </div>

    <!-- Centered Minimalist Card -->
    <section class="hero-content" aria-label="Coming Soon">
      <div class="eyebrow">
        <span class="status-dot" aria-hidden="true"></span>
        <span>bitfibonacci.com</span>
      </div>

      <h1><span>Coming Soon</span></h1>

      <nav class="links-row" aria-label="Social and Code Profiles">
        <a class="pill-btn primary" href="https://github.com/hus1643" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
          <span>GitHub</span>
        </a>

        <a class="pill-btn" href="https://www.linkedin.com/in/hussein-h-927408420/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>

          <span>LinkedIn</span>
        </a>
      </nav>
    </section>

    <footer class="footer-note">
      &phi; &approx; 1.6180339887
    </footer>
  </main>

  <script>
    (function () {
      var toggleBtn = document.getElementById('themeToggle');
      if (!toggleBtn) return;

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        toggleBtn.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
        try {
          localStorage.setItem('bf-theme', theme);
        } catch (e) {
          // Ignore storage restrictions in sandboxed iframes
        }
      }

      // Sync initial aria-pressed state
      var initialTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      toggleBtn.setAttribute('aria-pressed', initialTheme === 'light' ? 'true' : 'false');

      toggleBtn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme') || 'dark';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });

      // Listen for OS-level color scheme changes if user hasn't manually overridden
      if (window.matchMedia) {
        var mq = window.matchMedia('(prefers-color-scheme: light)');
        var handleSystemChange = function (e) {
          try {
            if (!localStorage.getItem('bf-theme')) {
              document.documentElement.setAttribute('data-theme', e.matches ? 'light' : 'dark');
            }
          } catch (err) {
            document.documentElement.setAttribute('data-theme', e.matches ? 'light' : 'dark');
          }
        };
        if (mq.addEventListener) {
          mq.addEventListener('change', handleSystemChange);
        } else if (mq.addListener) {
          mq.addListener(handleSystemChange);
        }
      }
    })();
  </script>
</body>
</html>
